        #midttopp{
            height: 100px;
            width: calc(100vw - 200px);
            color: rgb(243, 189, 136);

            display: flex;
            align-items: center;
            justify-content: center;

        }
        #hovedfelt{
            width: 80vw;
            min-height: 600px;
            background-color: rgba(243, 212, 165, 0.7);
            margin: auto; /* midtstiller div'en */
            padding: 20px;
            font-family: 'Times New Roman', Times, serif;
            font-size: large;

        }
        #blokker{
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 15px;
            padding: 8px;

            


        }
          .kort{
            background-color: aliceblue;



        }
        .kort h2{
            text-align: center;
            font-size: 30px;
            font-style: oblique;

            
            padding-bottom: 2px;


        }
        .blo{
            height: 300px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;

           background-size: cover;
           background-position: center;
            font-size: 30px;
            font-weight: bold;

            
        }
        .brazil{

        }

        }
        .australia{

        }

            background-image: url(Images/japan.jpg);


        }
        .costarica{

       #meny{
        position: absolute;
        top: 100px;
        width: 100vw;
        height: 200px;
        z-index: 1;

        display: flex;
        flex-direction: column;

       }
       #meny a{
        text-decoration: none;
        font-size: 45px;
        margin-bottom: 15px;

        text-align: center;
        color: black;


    
       }
       @media screen and (max-width: 798px){
        #linkefelt{
            display: none;
        }
        #burger{
            display: flex;
        }
        #meny{
            display: flex;

            transform: translate3d(0,-400px,0);
            transition-property: all;
            transition-duration: 1s;
        }

        #skifter:checked ~ #meny{

             transform: translate3d(0,0,0);

        }

       }
